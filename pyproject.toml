[project]
name = "dredd"
version = "2.1.0"
description = "Multi-channel batch autograder and submission manager for programming courses (C, Python, Java; GitHub Classroom & Moodle)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "autograder", "c-programming", "python", "java", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    # export-report: Markdown a HTML y PDF (ya venía con rich; se declara porque se usa directo).
    "markdown-it-py>=3.0.0",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.3",
    # Núcleo común del ecosistema (N-ECO-14): TyperConErrores y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN/yutani@6e42d7ab8b89a1084381f8aea0999a498a844f6c",
]

[project.optional-dependencies]
c = [
    "tree-sitter>=0.23.0,<0.26",
    "tree-sitter-c>=0.23.0",
]
python = [
    "pytest>=8.0.0",
]
java = []
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados; sin el extra se usa el camino propio (gcc, sin sandbox de nostromo…).
ecosistema = [
    "tree-sitter>=0.23.0,<0.26",
    "tree-sitter-c>=0.23.0",
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@c2c589bce318b0d6d5d6b324fecc20f3b0f2a8ec",
    "nostromo @ git+https://github.com/INGCOM-UNRN-P1/nostromo@033edd119afde3f0d17357d39fd70d5d163278c8",
    "gaff @ git+https://github.com/INGCOM-UNRN-P1/gaff@76834a12edfb0a6e26e7101cc6946462c8ab3f1b",
    "spunkmeyer @ git+https://github.com/INGCOM-UNRN-P1/spunkmeyer@26c618af3ac4dd88bb5b930f478351f45ef67dd7",
    "drake @ git+https://github.com/INGCOM-UNRN-P1/drake@a3bff5babba92d5953b98463c6257bafc305ca5a",
    "wierzbowski @ git+https://github.com/INGCOM-UNRN-P1/wierzbowski@7511bce23ba7e1f64d1ae0d37c918a551421b58d",
    # Normalización de weyl (alfa-equivalencia) para `cluster-errors --similitud`.
    "weyl @ git+https://github.com/INGCOM-UNRN-P1/weyl@4b204f627789fb0aa8c35bda5d4325ca27de49b2",
]

# Multiplexado de trabajos prácticos con las guías de deckard.
guias = [
    "deckard @ git+https://github.com/INGCOM-UNRN/deckard@953c229456c578043785cc195978bb8e1e10ebae",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN/dredd"
Repository = "https://github.com/INGCOM-UNRN/dredd.git"
Issues = "https://github.com/INGCOM-UNRN/dredd/issues"

[project.scripts]
dredd = "dredd.cli:app"

[project.entry-points."dredd.languages"]
c = "dredd.core.lenguajes.c:AdaptadorC"
python = "dredd.core.lenguajes.python:AdaptadorPython"
java = "dredd.core.lenguajes.java:AdaptadorJava"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dredd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true

[tool.mypy]
# Tipos del paquete (N-ECO-08): `uv run --with mypy mypy`, igual que el CI.
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
